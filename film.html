<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serie tv e film da guardare </title>
    <style>
        /* Stile per barrare il testo quando spunti la casella */
        input[type="checkbox"]:checked + span {
            text-decoration: line-through;
            color: #aaa;
        }
    </style>
</head>
<body style="font-family: Arial, sans-serif; background: #fff5f7; margin: 0; padding: 20px;">

    <div style="max-width: 500px; margin: 0 auto;">

        <h1 style="color: #ff4757; text-align: center; margin-bottom: 25px;">I nostri Film & Serie TV 🍿🎬</h1>

        <!-- Spiegazione -->
        <div style="background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; margin-bottom: 20px;">
            <p style="color: #666; font-size: 16px; margin: 0;">Spunta i film e le serie man mano che li guardiamo insieme! ✨</p>
        </div>

        <!-- Contenitore della lista con le spunte -->
        <div style="background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 25px;">
            
            <!-- Primo film -->
            <label style="display: flex; align-items: center; font-size: 18px; color: #333; margin-bottom: 15px; cursor: pointer;">
                <input type="checkbox" style="width: 20px; height: 20px; margin-right: 15px; accent-color: #ff4757; cursor: pointer;">
                <span>TVD SAGA</span>
            </label>

            <!-- Secondo film -->
            <label style="display: flex; align-items: center; font-size: 18px; color: #333; margin-bottom: 15px; cursor: pointer;">
                <input type="checkbox" style="width: 20px; height: 20px; margin-right: 15px; accent-color: #ff4757; cursor: pointer;">
                <span>Smallville 2</span>
            </label>

            <!-- Terzo film (puoi aggiungerne altri così) -->
            <label style="display: flex; align-items: center; font-size: 18px; color: #333; cursor: pointer;">
                <input type="checkbox" style="width: 20px; height: 20px; margin-right: 15px; accent-color: #ff4757; cursor: pointer;">
                <span>Elite 3</span>
            </label>

        </div>

        <!-- Pulsante per tornare alla home -->
        <div style="text-align: center;">
            <a href="index.html" style="background: #ff4757; color: white; padding: 12px 25px; border-radius: 10px; text-decoration: none; font-weight: bold; display: inline-block;">
                Torna alla home
            </a>
        </div>

    </div>

</body>
</html>
